<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e9ebf0;
    --muted: #9aa2b1;
    --accent: #ff4d4d;
    --accent-hover: #ff6666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .container { width: 100%; max-width: 640px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input[type=text]:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .video-preview { display: flex; gap: 14px; margin-top: 4px; }
  .video-preview img { width: 160px; border-radius: 8px; object-fit: cover; }
  .video-meta h3 { margin: 0 0 6px 0; font-size: 1rem; }
  .video-meta p { margin: 2px 0; color: var(--muted); font-size: 0.85rem; }
  .options { margin-top: 16px; }
  .options label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .options label:hover { border-color: var(--accent); }
  .options input[type=radio] { accent-color: var(--accent); }
  .status { margin-top: 12px; font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
  .status.error { color: #ff8080; }
  .status.success { color: #7fdc9a; }
  .hidden { display: none; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .settings-toggle {
    background: none; border: none; color: var(--muted);
    font-size: 0.8rem; padding: 0; margin-bottom: 12px; cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="container">
  <h1>YouTube Downloader</h1>
  <p class="sub">Paste a link, pick a quality or MP3, and download.</p>

  <button class="settings-toggle" id="settingsToggle">⚙ Backend API URL</button>
  <div class="card hidden" id="settingsCard">
    <div class="row">
      <input type="text" id="apiBase" placeholder="https://your-backend.onrender.com" />
      <button id="saveApiBtn">Save</button>
    </div>
    <div class="status" id="settingsStatus"></div>
  </div>

  <div class="card">
    <div class="row">
      <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="fetchBtn">Fetch</button>
    </div>
    <div class="status" id="fetchStatus"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="video-preview">
      <img id="thumb" src="" alt="thumbnail" />
      <div class="video-meta">
        <h3 id="title"></h3>
        <p id="uploader"></p>
        <p id="duration"></p>
      </div>
    </div>

    <div class="options">
      <label>
        <input type="radio" name="opt" value="mp3" checked />
        MP3 (audio only, 192kbps)
      </label>
      <div id="videoOptions"></div>
    </div>

    <button id="downloadBtn">Download</button>
    <div class="status" id="downloadStatus"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'ytdl_api_base';

function getApiBase() {
  return localStorage.getItem(STORAGE_KEY) || '';
}

const settingsToggle = document.getElementById('settingsToggle');
const settingsCard = document.getElementById('settingsCard');
const apiBaseInput = document.getElementById('apiBase');
const saveApiBtn = document.getElementById('saveApiBtn');
const settingsStatus = document.getElementById('settingsStatus');

apiBaseInput.value = getApiBase();
if (!getApiBase()) settingsCard.classList.remove('hidden');

settingsToggle.addEventListener('click', () => settingsCard.classList.toggle('hidden'));

saveApiBtn.addEventListener('click', () => {
  const val = apiBaseInput.value.trim().replace(/\/$/, '');
  localStorage.setItem(STORAGE_KEY, val);
  settingsStatus.textContent = 'Saved.';
  settingsStatus.className = 'status success';
});

const fetchBtn = document.getElementById('fetchBtn');
const urlInput = document.getElementById('url');
const fetchStatus = document.getElementById('fetchStatus');
const resultCard = document.getElementById('resultCard');
const videoOptions = document.getElementById('videoOptions');
const downloadBtn = document.getElementById('downloadBtn');
const downloadStatus = document.getElementById('downloadStatus');

function humanSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  return mb >= 1024 ? (mb / 1024).toFixed(2) + ' GB' : mb.toFixed(1) + ' MB';
}

function humanDuration(sec) {
  if (!sec) return '';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}

fetchBtn.addEventListener('click', async () => {
  const apiBase = getApiBase();
  if (!apiBase) {
    fetchStatus.textContent = 'Set your backend API URL first (⚙ above).';
    fetchStatus.className = 'status error';
    settingsCard.classList.remove('hidden');
    return;
  }

  const url = urlInput.value.trim();
  if (!url) { fetchStatus.textContent = 'Please paste a YouTube link.'; fetchStatus.className = 'status error'; return; }

  fetchBtn.disabled = true;
  fetchStatus.innerHTML = '<span class="spinner"></span>Fetching video info...';
  fetchStatus.className = 'status';
  resultCard.classList.add('hidden');

  try {
    const res = await fetch(`${apiBase}/api/info`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to fetch info');

    document.getElementById('thumb').src = data.thumbnail || '';
    document.getElementById('title').textContent = data.title || 'Untitled';
    document.getElementById('uploader').textContent = data.uploader || '';
    document.getElementById('duration').textContent = humanDuration(data.duration);

    videoOptions.innerHTML = '';
    (data.video_options || []).forEach(opt => {
      const label = document.createElement('label');
      label.innerHTML = `
        <input type="radio" name="opt" value="${opt.format_id}" />
        ${opt.height}p ${opt.ext ? '(' + opt.ext + ')' : ''} ${opt.filesize ? '~' + humanSize(opt.filesize) : ''}
      `;
      videoOptions.appendChild(label);
    });

    resultCard.classList.remove('hidden');
    fetchStatus.textContent = '';
    downloadStatus.textContent = '';
  } catch (e) {
    fetchStatus.textContent = e.message;
    fetchStatus.className = 'status error';
  } finally {
    fetchBtn.disabled = false;
  }
});

downloadBtn.addEventListener('click', async () => {
  const apiBase = getApiBase();
  const url = urlInput.value.trim();
  const selected = document.querySelector('input[name=opt]:checked');
  if (!selected) return;

  const isMp3 = selected.value === 'mp3';
  const payload = isMp3
    ? { url, mode: 'mp3' }
    : { url, mode: 'video', format_id: selected.value };

  downloadBtn.disabled = true;
  downloadStatus.innerHTML = '<span class="spinner"></span>Downloading and processing (this can take a while)...';
  downloadStatus.className = 'status';

  try {
    const res = await fetch(`${apiBase}/api/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Download failed');
    }

    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    const filename = match ? decodeURIComponent(match[1]) : (isMp3 ? 'audio.mp3' : 'video.mp4');

    const a = document.createElement('a');
    const objUrl = URL.createObjectURL(blob);
    a.href = objUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objUrl);

    downloadStatus.textContent = 'Done! Check your downloads folder.';
    downloadStatus.className = 'status success';
  } catch (e) {
    downloadStatus.textContent = e.message;
    downloadStatus.className = 'status error';
  } finally {
    downloadBtn.disabled = false;
  }
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') fetchBtn.click();
});
</script>
</body>
</html>
